[pytest]
# 默认只跑离线回归（快、可重复、断网也能跑）：
#   python -m pytest tests -q
# 联网验收套件（真实 DeepSeek + 高德）显式运行：
#   python -m pytest -m online -q
# 扩展用例（行程顾问、时长证据、包外地点、LLM 理解层等迭代期新增），
# 与正式用例分开存放，默认不跑：
#   python -m pytest tests_extra -q
addopts = -m "not online"
# 不带路径时只收正式套件：tests_extra/ 与 tests/ 里有同名文件（test_consult.py 等），
# 一次收集两个目录会因模块同名报 import file mismatch。
# 扩展套件显式给路径即可（命令行参数优先于 testpaths）：python -m pytest tests_extra -q
testpaths = tests
markers =
    online: 需要真实联网（DeepSeek 大模型 / 高德地图）的验收测试
